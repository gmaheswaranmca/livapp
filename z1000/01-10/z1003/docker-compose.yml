services:
  z1003_mysql_box:
    image: mysql:8
    container_name: z1003_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
      MYSQL_USER: user1
      MYSQL_PASSWORD: user123
    volumes:
      - mysql_z1003_data:/var/lib/mysql

volumes:
  mysql_z1003_data:

  