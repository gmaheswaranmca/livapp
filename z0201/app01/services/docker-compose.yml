services:
  gateway:
    build: ./gateway
    container_name: gateway
    env_file: .env

    ports:
      - "8080:8080"

    depends_on:
      - order-service

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
          
  order-service:
    build: ./order-service
    container_name: order-service
    env_file: .env

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    env_file: .env

    ports:
      - "5001:5001"

    depends_on:
      - postgres

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M

  payment-service:
    build: ./payment-service
    container_name: payment-service
    env_file: .env
    ports:
      - "5002:5002"

    depends_on:
      - postgres

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M

  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    env_file: .env

    ports:
      - "5003:5003"

    depends_on:
      - postgres

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M

  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 2G


volumes:
  postgres_data: